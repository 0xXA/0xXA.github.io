title: 0xXA
description: Security researcher — reverse engineering, vulnerability research, and automated security analysis of AI agents.
github_username: 0xXA
url: "https://0xXA.github.io"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /blog/:year/:month/:day/:title/

collections:
  opensource:
    output: true
    permalink: /opensource/:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "opensource"
    values:
      layout: "post"

# Update these two before publishing:
email: "you@example.com"
cv_url: "/cv.pdf"

exclude:
  - README.md
