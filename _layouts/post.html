---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%B %-d, %Y" }}
      {% if page.tags %} · {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}{% endif %}
    </p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="back-link">
    {% if page.collection == "opensource" %}
    <a href="{{ '/opensource/' | relative_url }}">&larr; Back to all open source contributions</a>
    {% else %}
    <a href="{{ '/blog/' | relative_url }}">&larr; Back to all posts</a>
    {% endif %}
  </p>
</article>
